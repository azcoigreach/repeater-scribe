<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="csrf-token" content="{{ csrf_token }}"><title>{{ callsign }} | Callsign History</title><link rel="stylesheet" href="/static/archive.css"></head>
<body><header class="topbar"><a class="brand" href="/"><img class="brand-logo" src="/static/logo.png" alt="REPEATER SCRIBE"></a><nav class="workspace-nav" aria-label="Workspaces"><a class="workspace-link" href="/">Dashboard</a><a class="workspace-link" href="/archive">Archive</a><a class="workspace-link active" href="/callsigns">Callsigns</a></nav><div class="identity">{{ identity }} <span>{{ role }}</span></div></header>
<main class="archive-shell"><section class="archive-heading"><div><p class="eyebrow">Callsign History</p><h1 id="profile-callsign">{{ callsign }}</h1><p id="profile-location">Loading profile...</p></div></section><section id="profile" class="recording-cards"></section><h2>Mention history</h2><form id="history-filters" class="filters"><label>From<input name="from" type="date"></label><label>To<input name="to" type="date"></label><label>Review<select name="review_status"><option value="">Non-rejected</option><option value="detected">Detected</option><option value="confirmed">Confirmed</option><option value="corrected">Corrected</option><option value="rejected">Rejected</option></select></label><label>Audio<select name="audio_status"><option value="">Any audio</option><option value="available">Available</option><option value="missing">Missing</option><option value="expired">Expired</option></select></label><button class="primary-button" type="submit">Apply</button></form><p id="history-state" class="state">Loading history...</p><section id="history" class="recording-cards"></section><button id="history-more" class="primary-button" type="button" hidden>Load more</button></main><script>window.callsignName = {{ callsign | tojson }}; window.callsignRole = {{ role | tojson }};</script><script src="/static/callsign_detail.js" defer></script></body></html>
