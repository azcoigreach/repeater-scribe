[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asl-transcriber"
version = "0.5.3"
description = "AllStarLink node control, network mapping, and local transcription dashboard"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "ASL Transcriber Contributors" }]
license = { text = "MIT" }
keywords = ["allstarlink", "radio", "transcription", "fastapi"]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "sqlalchemy>=2.0.35",
  "alembic>=1.13.0",
  "pydantic-settings>=2.4.0",
  "jinja2>=3.1.4",
  "watchfiles>=0.22.0",
  "faster-whisper>=1.0.0",
  "ffmpeg-python>=0.2.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "httpx>=0.27.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
  "pre-commit>=3.3.0",
]

[project.scripts]
asl-transcriber = "asl_transcriber.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = false

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
